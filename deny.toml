[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Maintenance advisory. Public timestamps and SQLx types still use chrono. Remove after migrating the workspace and its transitive dependencies." },
    { id = "RUSTSEC-2026-0555", reason = "Maintenance advisory. Cron and send windows still use chrono-tz for IANA time zones. Remove after migrating time zone handling." },
    { id = "RUSTSEC-2026-0542", reason = "Maintenance advisory. The object_store dependency still requires humantime. Remove when object_store can resolve without it." },
    # basic-toml is unmaintained, with no patched release. It is required by
    # askama_derive's config feature through uniffi_bindgen, enabled only by
    # orch8-mobile/bindgen (the developer CLI that generates SDK bindings).
    # It parses repository-local template configuration, not runtime input,
    # and is absent from the default/mobile library graph. Remove when
    # UniFFI/Askama replaces basic-toml. Do not suppress TLS/Wasm advisories.
    "RUSTSEC-2026-0374",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "MIT-0",
    "BSD-1-Clause",
    "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "orch8"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
