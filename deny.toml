[advisories]
ignore = [
    # basic-toml is unmaintained, with no patched release. It is required by
    # askama_derive's config feature through uniffi_bindgen, enabled only by
    # orch8-mobile/bindgen (the developer CLI that generates SDK bindings).
    # It parses repository-local template configuration, not runtime input,
    # and is absent from the default/mobile library graph. Remove when
    # UniFFI/Askama replaces basic-toml. Do not suppress TLS/Wasm advisories.
    "RUSTSEC-2026-0374",
    # RUSTSEC-2026-0367/0368/0369 affect zip's ZipArchive::extract and
    # stream extraction. zip 8.6 is only a build dependency of
    # utoipa-swagger-ui 10.0.1, whose build.rs iterates with by_index and
    # copies files itself; neither affected extraction API is called. Its
    # manifest requires zip ^8.6, while the fix is in zip 9. Remove this
    # exception once utoipa-swagger-ui accepts zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "MIT-0",
    "BSD-1-Clause",
    "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "orch8"

