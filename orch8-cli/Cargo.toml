[package]
name = "orch8-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "orch8"
path = "src/main.rs"
# Same output name as the `orch8` library crate; documenting both races on
# target/doc/orch8 (cargo#6313).
doc = false

[dependencies]
clap.workspace = true
clap_complete = "4"
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "time"] }
tokio-util.workspace = true
reqwest = { workspace = true }
anyhow.workspace = true
rand.workspace = true
owo-colors = { version = "4", features = ["supports-colors"] }
toml.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
orch8 = { path = "../orch8" }
orch8-types = { path = "../orch8-types" }
orch8-api = { path = "../orch8-api" }
orch8-storage = { path = "../orch8-storage" }
orch8-engine = { path = "../orch8-engine", default-features = false, features = ["compression"] }
orch8-push = { path = "../orch8-push" }
orch8-publisher = { path = "../orch8-publisher" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "migrate"] }
rust-embed = { version = "8", features = ["include-exclude"] }
tempfile = { workspace = true }
# `orch8 dev --worker-watch <glob>` matching.
globset = "0.4"
# `orch8 backup` / `orch8 restore` archives (tar.gz). tar >= 0.4.45 carries
# the RUSTSEC-2026-0067/0068 fixes; restore never unpacks to disk anyway.
flate2 = "1"
tar = "0.4.45"

[target.'cfg(unix)'.dependencies]
# `orch8 dev --worker`: signal whole worker process groups (killpg) so
# forked grandchildren never outlive the dev session.
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true
