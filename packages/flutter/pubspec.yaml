name: orch8_flutter
description: Flutter plugin for the Orch8 Mobile SDK — server-configurable on-device workflows.
version: 0.7.1
homepage: https://github.com/orch8-io/orch8-flutter
repository: https://github.com/orch8-io/orch8-flutter
issue_tracker: https://github.com/orch8-io/orch8-flutter/issues

environment:
  sdk: "^3.12.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.orch8.flutter
        pluginClass: Orch8FlutterPlugin
      ios:
        pluginClass: Orch8FlutterPlugin
