name: Publish npm package

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typescript
      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          package="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the version is already published
        id: registry
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE}@${VERSION}" version > /dev/null 2>&1; then
            echo "${PACKAGE} ${VERSION} is already on npm; treating this run as verified."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${PACKAGE} ${VERSION} is not on npm; publication is required."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --provenance --access public
      - name: Verify npm package
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          VERSION: ${{ steps.package.outputs.version }}
        run: test "$(npm view "${PACKAGE}@${VERSION}" version)" = "$VERSION"
