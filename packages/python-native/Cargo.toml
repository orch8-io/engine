[package]
name = "orch8-python"
version = "0.7.1"
edition = "2024"
license = "BUSL-1.1"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
orch8 = { path = "../../orch8", default-features = false }
orch8-types = { path = "../../orch8-types" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
