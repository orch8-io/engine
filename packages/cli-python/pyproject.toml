[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "orch8-cli"
version = "0.7.1"
description = "Verified pipx shim for the native Orch8 CLI"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }

[project.scripts]
orch8 = "orch8_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orch8_cli"]
