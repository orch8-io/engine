{{- if .Values.metrics.scrapeConfigSecret.enabled }}
{{- $secret := include "orch8.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orch8.fullname" . }}-scrape-config
  labels:
    {{- include "orch8.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Reference from Prometheus `additionalScrapeConfigs` (or paste into
  # prometheus.yml). Requires a Prometheus version that supports the
  # `http_headers` scrape option, and the engine Secret listed in the
  # Prometheus `spec.secrets` so the key file below is mounted.
  scrape-config.yaml: |
    - job_name: {{ include "orch8.metricsJobName" . }}
      metrics_path: /metrics
      scrape_interval: {{ .Values.metrics.scrapeConfigSecret.interval }}
      http_headers:
        x-api-key:
          files:
            - /etc/prometheus/secrets/{{ $secret }}/{{ .Values.secrets.apiKeyKey }}
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [{{ .Release.Namespace | quote }}]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
          regex: {{ .Release.Name | quote }}
          action: keep
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          regex: {{ include "orch8.apiComponent" . | quote }}
          action: keep
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: http
          action: keep
{{- end }}
