{{- include "orch8.validate" . -}}
{{- if eq .Values.mode "split" }}
{{ include "orch8.deployment" (dict "root" . "component" "control" "role" "control" "cfg" .Values.control) }}
---
{{ include "orch8.service" (dict "root" . "component" "control" "http" true "metrics" true) }}
---
{{ include "orch8.deployment" (dict "root" . "component" "executor" "role" "executor" "cfg" .Values.executor) }}
---
{{ include "orch8.service" (dict "root" . "component" "executor" "http" false "metrics" false) }}
{{- else }}
{{ include "orch8.deployment" (dict "root" . "component" "all-in-one" "role" "all_in_one" "cfg" .Values.allInOne) }}
---
{{ include "orch8.service" (dict "root" . "component" "all-in-one" "http" true "metrics" true) }}
{{- end }}
