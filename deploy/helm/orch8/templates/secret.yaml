{{- $v := .Values }}
{{- $needDbUrl := and (eq $v.storage.backend "postgres") (not $v.postgresql.enabled) (not $v.externalDatabase.existingSecret) }}
{{- if or (not $v.secrets.existingSecret) $needDbUrl }}
{{- $name := include "orch8.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orch8.labels" . | nindent 4 }}
  annotations:
    # Never delete the encryption key on uninstall: encrypted rows are
    # unreadable without it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not $v.secrets.existingSecret }}
  {{- if $v.secrets.apiKey }}
  {{ $v.secrets.apiKeyKey }}: {{ $v.secrets.apiKey | b64enc | quote }}
  {{- else if hasKey $data $v.secrets.apiKeyKey }}
  {{ $v.secrets.apiKeyKey }}: {{ index $data $v.secrets.apiKeyKey | quote }}
  {{- else }}
  {{ $v.secrets.apiKeyKey }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- if $v.secrets.encryptionKey }}
  {{ $v.secrets.encryptionKeyKey }}: {{ $v.secrets.encryptionKey | b64enc | quote }}
  {{- else if hasKey $data $v.secrets.encryptionKeyKey }}
  {{ $v.secrets.encryptionKeyKey }}: {{ index $data $v.secrets.encryptionKeyKey | quote }}
  {{- else }}
  {{- /* sha256 of a random string = 64 hex characters, the required format. */}}
  {{ $v.secrets.encryptionKeyKey }}: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $needDbUrl }}
  database-url: {{ $v.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
