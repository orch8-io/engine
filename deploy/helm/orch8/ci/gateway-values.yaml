secrets:
  apiKey: ci-api-key-not-a-real-secret
  encryptionKey: "c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1"
