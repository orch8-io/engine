# Pre-created secrets for keys and database URL; no chart-managed Secret.
secrets:
  existingSecret: orch8-keys
  apiKeyKey: ORCH8_API_KEY
  encryptionKeyKey: ORCH8_ENCRYPTION_KEY
externalDatabase:
  existingSecret: orch8-keys
  existingSecretKey: ORCH8_DATABASE_URL
config:
  corsOrigins: https://app.example.com
  toml: |
    [engine]
    max_concurrent_steps = 64
