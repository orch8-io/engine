[package]
name = "orch8-storage"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
orch8-types = { path = "../orch8-types" }
# Only the outbox/governance traits; APNs/FCM senders stay in the server.
orch8-push = { path = "../orch8-push", default-features = false }
sqlx.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
object_store = { workspace = true, optional = true }
futures.workspace = true
bytes.workspace = true
moka.workspace = true
rand.workspace = true
# Already in the graph via sqlx; needed here for `tokio::spawn` of the
# fire-and-forget `last_used_at` touch on the auth hot path.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
zstd = { version = "0.14", optional = true }
# BYOK payload vault (customer bucket + KMS envelope encryption). All
# already in the workspace graph; no new crates.
aes-gcm = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
# Server builds keep every backend. `orch8-mobile` (and `orch8-engine`, which
# re-enables what it needs) use `default-features = false` so the on-device
# library links only SQLite.
default = ["compression", "postgres", "artifacts", "byok"]
compression = ["dep:zstd"]
# Postgres backend (`postgres` module, tenant partitioning) + sqlx TLS.
postgres = ["sqlx/postgres", "sqlx/runtime-tokio-rustls", "artifacts"]
# Object-store backed artifact store (local FS / S3 / in-memory).
artifacts = ["dep:object_store"]
# Customer-owned payload vault with envelope encryption (AWS KMS / static key).
byok = ["artifacts", "dep:aes-gcm", "dep:hmac", "dep:sha2", "dep:base64", "dep:zeroize", "dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
criterion.workspace = true

[[bench]]
name = "storage_bench"
harness = false

[lints]
workspace = true
