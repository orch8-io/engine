[package]
name = "orch8-storage"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
orch8-types = { path = "../orch8-types" }
# Only the outbox/governance traits; APNs/FCM senders stay in the server.
orch8-push = { path = "../orch8-push", default-features = false }
sqlx.workspace = true
sqlx-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
object_store = { workspace = true, optional = true }
futures.workspace = true
bytes.workspace = true
moka.workspace = true
rand.workspace = true
# Already in the graph via sqlx; needed here for `tokio::spawn` of the
# fire-and-forget `last_used_at` touch on the auth hot path.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
zstd = { version = "0.14", optional = true }
# BYOK payload vault (customer bucket + KMS envelope encryption). All
# already in the workspace graph; no new crates.
aes-gcm = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2.workspace = true
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
# Server builds keep every backend. `orch8-mobile` (and `orch8-engine`, which
# re-enables what it needs) use `default-features = false` so the on-device
# library links only SQLite.
default = ["compression", "postgres", "artifacts", "byok"]
compression = ["dep:zstd"]
# Postgres backend (`postgres` module, tenant partitioning) + sqlx TLS.
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-webpki", "artifacts"]
# Local files / in-memory artifacts for on-device and embedded runtimes.
artifacts-local = ["dep:object_store"]
# Server feature retains S3 alongside local/in-memory backends.
artifacts = ["artifacts-local", "object_store/aws"]
# Customer-owned payload vault with envelope encryption (AWS KMS / static key).
# Test infrastructure (`orch8_storage::testing`): fault-injecting storage,
# fixtures, backend matrix. Enabled only by dev-dependencies.
test-util = []
byok = ["artifacts", "dep:aes-gcm", "dep:hmac", "dep:base64", "dep:zeroize", "dep:reqwest"]

[dev-dependencies]
# Integration tests in `tests/` use `orch8_storage::testing`.
orch8-storage = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "storage_bench"
harness = false

[lints]
workspace = true
