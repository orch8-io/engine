name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "orch8-mobile/**"
      - "orch8-engine/**"
      - "orch8-storage/**"
      - "orch8-types/**"
      - "orch8-publisher/**"
      - "packages/**"
      - "scripts/check-sdk-versions.sh"
      - "scripts/check-kmp-apple-bridge.sh"
      - "scripts/check-android-elf-align.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "orch8-mobile/**"
      - "orch8-engine/**"
      - "orch8-storage/**"
      - "orch8-types/**"
      - "orch8-publisher/**"
      - "packages/**"
      - "scripts/check-sdk-versions.sh"
      - "scripts/check-kmp-apple-bridge.sh"
      - "scripts/check-android-elf-align.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Android package version to publish from main (for release recovery)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- iOS builds ----------------------------------------------------------
  ios:
    name: iOS (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
            label: device
          - target: aarch64-apple-ios-sim
            label: sim-arm64
          - target: x86_64-apple-ios
            label: sim-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - name: Ensure cargo on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ios-${{ matrix.target }}

      - name: Build liborch8_mobile
        run: cargo build --profile mobile-release --target ${{ matrix.target }} -p orch8-mobile
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"

      - name: Upload static library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: liborch8_mobile-${{ matrix.label }}
          path: target/${{ matrix.target }}/mobile-release/liborch8_mobile.a

  # -- Android builds ------------------------------------------------------
  android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            label: arm64-v8a
          - target: armv7-linux-androideabi
            label: armeabi-v7a
          - target: x86_64-linux-android
            label: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - name: Ensure cargo on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: android-${{ matrix.target }}

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Configure NDK toolchain
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${TOOLCHAIN}/bin/armv7a-linux-androideabi24-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/x86_64-linux-android24-clang"
            echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=${TOOLCHAIN}/bin/armv7a-linux-androideabi24-clang"
            echo "CC_x86_64_linux_android=${TOOLCHAIN}/bin/x86_64-linux-android24-clang"
            echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar"
            echo "AR_armv7_linux_androideabi=${TOOLCHAIN}/bin/llvm-ar"
            echo "AR_x86_64_linux_android=${TOOLCHAIN}/bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build liborch8_mobile
        run: cargo build --profile mobile-release --target ${{ matrix.target }} -p orch8-mobile

      - name: Verify 16 KB ELF alignment
        env:
          READELF: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
        run: ./scripts/check-android-elf-align.sh target/${{ matrix.target }}/mobile-release/liborch8_mobile.so

      - name: Upload shared library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: liborch8_mobile-${{ matrix.label }}
          path: target/${{ matrix.target }}/mobile-release/liborch8_mobile.so

  # -- Generate bindings ---------------------------------------------------
  bindings:
    name: Generate bindings
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.97.0"
      - name: Ensure cargo on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build library for binding generation
        run: cargo build -p orch8-mobile

      - name: Generate Swift bindings
        run: |
          cargo run -p orch8-mobile --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/liborch8_mobile.dylib \
            --language swift --out-dir bindings/swift

      - name: Generate Kotlin bindings
        run: |
          cargo run -p orch8-mobile --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/liborch8_mobile.dylib \
            --language kotlin --out-dir bindings/kotlin

      - name: Upload bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings
          path: bindings/

      - name: Upload native host library for KMP integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-native-host
          path: target/debug/liborch8_mobile.dylib
          if-no-files-found: error

  kmp-tests:
    name: KMP JVM and Apple bridge
    runs-on: macos-latest
    timeout-minutes: 25
    needs: [bindings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings
          path: artifacts/bindings
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-native-host
          path: artifacts/native-host
      - name: Run common and real native JVM tests
        run: |
          cp artifacts/bindings/kotlin/io/orch8/mobile/orch8_mobile.kt orch8-mobile/bindings/kotlin/io/orch8/mobile/
          gradle -p packages/kmp -Porch8.kmp.targets=jvm \
            "-Porch8.native.lib.path=$GITHUB_WORKSPACE/artifacts/native-host" jvmTest
      - name: Compile real Kotlin Native framework and Swift bridge
        run: |
          gradle -p packages/kmp -Porch8.kmp.targets=ios linkDebugFrameworkIosSimulatorArm64
          cp artifacts/bindings/swift/Orch8MobileFFI.modulemap artifacts/bindings/swift/module.modulemap
          bash scripts/check-kmp-apple-bridge.sh \
            "$GITHUB_WORKSPACE/packages/kmp/build/bin/iosSimulatorArm64/debugFramework" \
            "$GITHUB_WORKSPACE/artifacts/bindings/swift"

  # -- Package XCFramework -------------------------------------------------
  xcframework:
    name: XCFramework
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [ios, bindings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download iOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Build XCFramework
        run: |
          mkdir -p build/ios-device build/ios-sim-arm64 build/ios-sim-x64 build/headers

          cp artifacts/liborch8_mobile-device/liborch8_mobile.a build/ios-device/
          cp artifacts/liborch8_mobile-sim-arm64/liborch8_mobile.a build/ios-sim-arm64/
          cp artifacts/liborch8_mobile-sim-x64/liborch8_mobile.a build/ios-sim-x64/

          cp artifacts/bindings/swift/Orch8MobileFFI.h build/headers/
          cp artifacts/bindings/swift/Orch8MobileFFI.modulemap build/headers/module.modulemap

          mkdir -p build/ios-simulator
          lipo -create \
            build/ios-sim-arm64/liborch8_mobile.a \
            build/ios-sim-x64/liborch8_mobile.a \
            -output build/ios-simulator/liborch8_mobile.a

          xcodebuild -create-xcframework \
            -library build/ios-device/liborch8_mobile.a -headers build/headers \
            -library build/ios-simulator/liborch8_mobile.a -headers build/headers \
            -output build/Orch8Mobile.xcframework

          cp LICENSE build/Orch8Mobile.xcframework/LICENSE
          ./scripts/check-xcframework.sh build/Orch8Mobile.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Orch8Mobile.xcframework
          path: build/Orch8Mobile.xcframework

  # -- Package Android AAR -------------------------------------------------
  aar:
    name: Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [android, bindings]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble AAR
        working-directory: packages/android
        run: |
          mkdir -p orch8-mobile/src/main/jniLibs/arm64-v8a
          mkdir -p orch8-mobile/src/main/jniLibs/armeabi-v7a
          mkdir -p orch8-mobile/src/main/jniLibs/x86_64
          mkdir -p orch8-mobile/src/main/java/io/orch8/mobile

          cp ../../artifacts/liborch8_mobile-arm64-v8a/liborch8_mobile.so orch8-mobile/src/main/jniLibs/arm64-v8a/
          cp ../../artifacts/liborch8_mobile-armeabi-v7a/liborch8_mobile.so orch8-mobile/src/main/jniLibs/armeabi-v7a/
          cp ../../artifacts/liborch8_mobile-x86_64/liborch8_mobile.so orch8-mobile/src/main/jniLibs/x86_64/
          cp ../../artifacts/bindings/kotlin/io/orch8/mobile/orch8_mobile.kt orch8-mobile/src/main/java/io/orch8/mobile/

          gradle :orch8-mobile:assembleRelease
          bash ../../scripts/embed-aar-license.sh \
            orch8-mobile/build/outputs/aar/orch8-mobile-release.aar \
            ../../LICENSE

      - name: Upload AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orch8-mobile.aar
          path: packages/android/orch8-mobile/build/outputs/aar/orch8-mobile-release.aar
      - name: Publish Android package
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_version != ''
        working-directory: packages/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCH8_MOBILE_VERSION: ${{ inputs.publish_version || github.ref_name }}
        run: |
          requested_version="${ORCH8_MOBILE_VERSION#v}"
          checked_in_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [[ "$requested_version" != "$checked_in_version" ]]; then
            echo "::error::Requested Android package version $requested_version does not match VERSION_NAME=$checked_in_version."
            exit 1
          fi
          gradle :orch8-mobile:publishReleasePublicationToGitHubPackagesRepository

  # -- Wrapper package tests -------------------------------------------------
  # Pure-logic tests for the SDK wrappers. They do not need the Rust build.
  swift-tests:
    name: Swift package tests
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [xcframework]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download current XCFramework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Orch8Mobile.xcframework
          path: artifacts/xcframework
      - name: Use current XCFramework
        run: |
          if [[ -f artifacts/xcframework/Info.plist ]]; then
            mv artifacts/xcframework packages/swift/Orch8Mobile.xcframework
          elif [[ -f artifacts/xcframework/Orch8Mobile.xcframework/Info.plist ]]; then
            mv artifacts/xcframework/Orch8Mobile.xcframework packages/swift/
          else
            echo '::error::Downloaded XCFramework is missing Info.plist'
            exit 1
          fi
      # The package is iOS-only (binary XCFramework), so `swift test` on the
      # macOS host cannot link it: run the tests on an iOS simulator.
      - name: Test on an iOS simulator
        working-directory: packages/swift
        env:
          ORCH8_MOBILE_LOCAL_XCFRAMEWORK: "1"
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devs.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')"
          xcodebuild test -scheme Orch8Mobile -destination "platform=iOS Simulator,id=${UDID}" \
            SWIFT_STRICT_CONCURRENCY=complete SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  flutter-tests:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter (stable)
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze
        working-directory: packages/flutter
        run: |
          flutter pub get
          flutter analyze
      - name: Test
        working-directory: packages/flutter
        run: flutter test

  react-native-tests:
    name: React Native typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - name: Typecheck and test
        working-directory: packages/react-native
        run: |
          npm ci
          npm run typescript
          npm test

  # GitHub Release creation and native release assets are owned exclusively by
  # release.yml. Keeping a second publisher here creates a race and can produce
  # an incomplete or incorrectly classified prerelease. This workflow still
  # publishes the versioned Android Maven package from the AAR job above.
